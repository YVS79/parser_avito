# --- USB 4G модем (ZTE MF823D и совместимые) ---
# Работать через модем, даже если есть Wi-Fi/Ethernet.
use_usb_modem = false
# Адрес веб-интерфейса модема. Пусто = автоопределение (192.168.0.1 / 192.168.4.1 / 192.168.32.1).
modem_gateway = ""
# Принудительно задать локальный IP/интерфейс модема (обычно не требуется).
modem_local_ip = ""
modem_interface = ""
# Пароль веб-интерфейса модема, если он включён.
modem_password = ""
# fast_then_reboot | fast | reboot
modem_rotation_strategy = "fast_then_reboot"
# Сколько секунд ждать восстановление соединения после быстрого переподключения.
modem_fast_timeout = 8
# Сколько раз пробовать быстрое переподключение до перезагрузки модема.
modem_fast_attempts = 2
# Перезагружать модем, если быстрый способ не изменил WAN IP.
modem_reboot_on_fail = true
# Сколько секунд ждать восстановления CGI, LTE и WAN IP после перезагрузки.
modem_reboot_timeout = 120
# Максимум перезагрузок за одну смену IP (0 = не перезагружать).
modem_max_reboots = 1
# Привязывать исходящие сокеты к интерфейсу модема (рекомендуется).
modem_bind_interface = true
